name: Daily Search Index Refresh

on:
  schedule:
    # Every day at 22:00 UTC = 07:00 KST.
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-search-index-refresh
  cancel-in-progress: false

jobs:
  daily-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      BASE_URL: https://jandi-notion-search.vercel.app
      REINDEX_TOKEN: ${{ secrets.REINDEX_TOKEN }}

    steps:
      - name: Validate secret
        shell: bash
        run: |
          if [ -z "$REINDEX_TOKEN" ]; then
            echo "::error::GitHub repository secret REINDEX_TOKEN is not configured."
            exit 1
          fi

      - name: Refresh Notion
        shell: bash
        run: |
          set -uo pipefail

          STATUS="$(curl --silent --show-error --max-time 30             "${BASE_URL}/api/reindex/status?token=${REINDEX_TOKEN}")"
          echo "$STATUS"

          NOTION_STATUS="$(echo "$STATUS" | jq -r '.status // "none"')"

          if [ "$NOTION_STATUS" != "running" ] && [ "$NOTION_STATUS" != "paused" ]; then
            curl --silent --show-error --max-time 120               "${BASE_URL}/api/reindex/start?token=${REINDEX_TOKEN}" || true
          fi

          for i in $(seq 1 20); do
            STATUS="$(curl --silent --show-error --max-time 30               "${BASE_URL}/api/reindex/status?token=${REINDEX_TOKEN}")"
            NOTION_STATUS="$(echo "$STATUS" | jq -r '.status // "none"')"

            if [ "$NOTION_STATUS" != "running" ]; then
              break
            fi

            echo "Notion batch ${i}/20"

            curl --silent --show-error --max-time 260               "${BASE_URL}/api/reindex/next?token=${REINDEX_TOKEN}" || break
            echo
          done

      - name: Broadcom daily incremental sync
        shell: bash
        run: |
          set -uo pipefail

          START="$(curl --silent --show-error --max-time 180             "${BASE_URL}/api/broadcom?action=daily_start&token=${REINDEX_TOKEN}")"

          echo "$START"

          PHASE="$(echo "$START" | jq -r '.phase // "idle"')"

          if [ "$PHASE" = "daily" ]; then
            for i in $(seq 1 20); do
              echo "Broadcom daily batch ${i}/20"

              RESULT="$(curl --silent --show-error --max-time 260                 "${BASE_URL}/api/broadcom?action=daily_next&token=${REINDEX_TOKEN}")"
              CURL_EXIT=$?

              echo "$RESULT"

              if [ "$CURL_EXIT" -ne 0 ]; then
                echo "::warning::Broadcom daily batch failed; next daily run will continue."
                break
              fi

              DONE="$(echo "$RESULT" | jq -r '.completed // false')"

              if [ "$DONE" = "true" ]; then
                break
              fi

              sleep 1
            done
          else
            echo "No Broadcom daily work is needed or initial full build is not complete."
          fi
