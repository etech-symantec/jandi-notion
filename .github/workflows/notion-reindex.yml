name: Notion Reindex Worker

on:
  schedule:
    # GitHub Actions scheduled workflows use UTC.
    # Every 5 minutes. GitHub may delay scheduled jobs during busy periods.
    - cron: "2-57/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notion-reindex-worker
  cancel-in-progress: false

jobs:
  process-next-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      BASE_URL: https://jandi-notion-search.vercel.app
      REINDEX_TOKEN: ${{ secrets.REINDEX_TOKEN }}

    steps:
      - name: Validate secret
        shell: bash
        run: |
          if [ -z "$REINDEX_TOKEN" ]; then
            echo "::error::GitHub repository secret REINDEX_TOKEN is not configured."
            exit 1
          fi

      - name: Check reindex status
        id: status
        shell: bash
        run: |
          set -euo pipefail

          STATUS_JSON="$(curl --fail --silent --show-error \
            --max-time 30 \
            "${BASE_URL}/api/reindex/status?token=${REINDEX_TOKEN}")"

          echo "$STATUS_JSON"

          STATUS="$(echo "$STATUS_JSON" | jq -r '.status // empty')"
          EXISTS="$(echo "$STATUS_JSON" | jq -r '.exists // false')"
          PROGRESS="$(echo "$STATUS_JSON" | jq -r '.progress // 0')"
          PROCESSED="$(echo "$STATUS_JSON" | jq -r '.processedPages // 0')"
          TOTAL="$(echo "$STATUS_JSON" | jq -r '.totalPages // 0')"

          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "exists=$EXISTS" >> "$GITHUB_OUTPUT"

          echo "Current state: status=${STATUS:-none}, progress=${PROGRESS}%, processed=${PROCESSED}/${TOTAL}"

      - name: Process next batch
        if: steps.status.outputs.exists == 'true' && steps.status.outputs.status == 'running'
        shell: bash
        run: |
          set -uo pipefail

          echo "Reindex is running. Processing next batch..."

          HTTP_CODE="$(curl --silent --show-error \
            --max-time 260 \
            --output /tmp/notion-next.json \
            --write-out "%{http_code}" \
            "${BASE_URL}/api/reindex/next?token=${REINDEX_TOKEN}")"
          CURL_EXIT=$?

          if [ -f /tmp/notion-next.json ]; then
            cat /tmp/notion-next.json
            echo
          fi

          if [ "$CURL_EXIT" -eq 28 ]; then
            echo "::warning::Notion next batch timed out. The next scheduled worker will retry."
            exit 0
          fi

          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "::warning::Notion next batch curl failed with exit code ${CURL_EXIT}."
            exit 0
          fi

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::warning::Notion next batch returned HTTP ${HTTP_CODE}."
            exit 0
          fi

      - name: Check Broadcom reindex status
        id: broadcom_status
        shell: bash
        run: |
          set -euo pipefail

          STATUS_JSON="$(curl --fail --silent --show-error --max-time 30 \
            "${BASE_URL}/api/broadcom?action=status&token=${REINDEX_TOKEN}")"

          echo "$STATUS_JSON"

          PHASE="$(echo "$STATUS_JSON" | jq -r '.phase // "idle"')"

          echo "phase=$PHASE" >> "$GITHUB_OUTPUT"

      - name: Process next Broadcom batch
        if: steps.broadcom_status.outputs.phase == 'title' || steps.broadcom_status.outputs.phase == 'body'
        shell: bash
        run: |
          set -uo pipefail

          echo "Broadcom rebuild active. Processing up to 10 batches..."

          for i in $(seq 1 10); do
            echo "===== Broadcom batch ${i}/10 ====="

            HTTP_CODE="$(curl --silent --show-error \
              --max-time 260 \
              --output /tmp/broadcom-next.json \
              --write-out "%{http_code}" \
              "${BASE_URL}/api/broadcom?action=next&token=${REINDEX_TOKEN}")"
            CURL_EXIT=$?

            if [ -f /tmp/broadcom-next.json ]; then
              cat /tmp/broadcom-next.json
              echo
            fi

            if [ "$CURL_EXIT" -eq 28 ]; then
              echo "::warning::Broadcom batch ${i} timed out. Stop this worker run and continue on the next schedule."
              break
            fi

            if [ "$CURL_EXIT" -ne 0 ]; then
              echo "::warning::Broadcom batch ${i} curl failed with exit code ${CURL_EXIT}. Stop this worker run."
              break
            fi

            if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
              echo "::warning::Broadcom batch ${i} returned HTTP ${HTTP_CODE}. Stop this worker run."
              break
            fi

            PHASE="$(jq -r '.phase // empty' /tmp/broadcom-next.json 2>/dev/null || true)"
            STATUS="$(jq -r '.state.status // empty' /tmp/broadcom-next.json 2>/dev/null || true)"
            SKIPPED="$(jq -r '.skipped // false' /tmp/broadcom-next.json 2>/dev/null || true)"

            if [ "$STATUS" = "completed" ]; then
              echo "Broadcom current phase completed."
            fi

            if [ "$SKIPPED" = "true" ]; then
              echo "No active Broadcom batch remains."
              break
            fi

            # Tiny pause between Vercel invocations.
            sleep 1
          done
